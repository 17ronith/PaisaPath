<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ad Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=block" rel="stylesheet">
<style>
  /* The ad's stage: 1920×1080. Nothing here animates by itself — the recorder calls
     studio.frame(t) once per video frame and every layer is drawn for exactly that time. */
  @font-face { font-family: 'Jersey'; src: url('/assets/fonts/Jersey10-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Press'; src: url('/assets/fonts/PressStart2P-latin.woff2') format('woff2'); }
  :root { --ink: #f3f3f7; --muted: #a9a9c6; --navy: #0b0d1c; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: var(--ink);
    font-family: 'Inter', 'Inter Display', system-ui, sans-serif; }
  #bg { position: absolute; inset: 0; }

  /* Left column: part number, title, pillar, measures */
  #side { position: absolute; left: 150px; top: 250px; width: 760px; }
  #side .n { font-family: 'Press'; font-size: 22px; letter-spacing: 2px; color: var(--accent, #6fd6c0); }
  #side .title { font-size: 84px; font-weight: 900; line-height: 1.02; letter-spacing: -2px; margin-top: 22px; }
  #side .line { font-size: 30px; font-weight: 500; color: var(--muted); margin-top: 22px; line-height: 1.3; }
  #side .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
  #side .chip { font-size: 22px; font-weight: 700; padding: 10px 18px; border-radius: 999px;
    background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.14); }
  #side .chip.pillar { background: var(--accent); color: #0b0d1c; border-color: transparent; }
  #side > * { will-change: transform, opacity; }

  /* The phone: an iPhone-style frame around the game */
  #phoneWrap { position: absolute; left: 1084px; top: 73px; width: 452px; height: 934px; transform-origin: 0 0; }
  #phone { position: absolute; inset: 0; border-radius: 74px;
    background: linear-gradient(145deg, #5b5d66 0%, #2a2b30 18%, #17181b 50%, #2b2c31 82%, #61636c 100%);
    box-shadow: 0 60px 120px rgba(0,0,0,.6), 0 18px 40px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.18); }
  #phone::before { content: ''; position: absolute; inset: 6px; border-radius: 68px; background: #050506; }
  .side-btn { position: absolute; width: 5px; background: linear-gradient(90deg, #3c3d43, #6a6c75); border-radius: 3px; }
  #screen { position: absolute; left: 18px; top: 18px; width: 416px; height: 898px; border-radius: 58px; overflow: hidden;
    background: #1b1b2f; }
  #game { position: absolute; inset: 0; width: 416px; height: 898px; border: 0; }
  #island { position: absolute; left: 145px; top: 12px; width: 126px; height: 36px; border-radius: 20px; background: #000; }
  #status { position: absolute; left: 0; right: 0; top: 0; height: 56px; display: flex; align-items: center;
    justify-content: space-between; padding: 0 34px 0 46px; font: 600 17px Inter, system-ui; color: #fff; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  #status .icons { display: flex; gap: 7px; align-items: center; }
  #glare { position: absolute; inset: 0; pointer-events: none; border-radius: 58px;
    background: linear-gradient(115deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 32%); }
  #fx { position: absolute; inset: 0; pointer-events: none; }

  /* Laptop for the NGO dashboard */
  #laptopWrap { position: absolute; left: 820px; top: 150px; width: 1000px; height: 690px; opacity: 0; }
  #lid { position: absolute; left: 30px; top: 0; width: 940px; height: 600px; border-radius: 26px; background: #18191c;
    box-shadow: 0 50px 100px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.12); }
  #lscreen { position: absolute; left: 22px; top: 22px; width: 896px; height: 556px; overflow: hidden; border-radius: 8px; background: #1b1b2f; }
  #ngo { width: 1280px; height: 794px; border: 0; transform: scale(.7); transform-origin: 0 0; }
  #lbase { position: absolute; left: 0; top: 598px; width: 1000px; height: 26px; border-radius: 0 0 22px 22px;
    background: linear-gradient(#cfd2d8, #8f939b); box-shadow: 0 30px 60px rgba(0,0,0,.5); }

  /* The PDF report page */
  #pdf { position: absolute; left: 190px; top: 120px; width: 600px; opacity: 0; transform-origin: 50% 50%; }
  #pdf img { width: 600px; display: block; border-radius: 6px; box-shadow: 0 40px 90px rgba(0,0,0,.6); }

  /* Captions */
  #captions { position: absolute; left: 150px; top: 860px; width: 820px; height: 140px; }
  #cap { font-size: 38px; font-weight: 700; line-height: 1.25; letter-spacing: -.3px;
    text-shadow: 0 2px 18px rgba(0,0,0,.65); }

  /* Cold open / end card */
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  #overlay .full { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .big { font-size: 260px; font-weight: 900; letter-spacing: -10px; line-height: 1; }
  .sub { font-size: 50px; font-weight: 700; letter-spacing: -1px; margin-top: 18px; }
  .src { font-size: 22px; font-weight: 500; color: var(--muted); margin-top: 26px; letter-spacing: 1px; text-transform: uppercase; }
  .q { font-size: 64px; font-weight: 800; letter-spacing: -1.5px; max-width: 1300px; line-height: 1.12; }
  .logo { font-family: 'Jersey'; font-size: 150px; line-height: .95; letter-spacing: 2px; color: #fff;
    text-shadow: 0 8px 0 #2b2b52, 0 30px 80px rgba(111,214,192,.35); }
  .tag { font-size: 40px; font-weight: 700; margin-top: 34px; color: #e9e9f5; }
  .meta { font-family: 'Press'; font-size: 18px; color: var(--muted); margin-top: 46px; letter-spacing: 2px; }
  .pillars { display: flex; gap: 14px; margin-top: 36px; }
  .pillars span { font-size: 24px; font-weight: 800; padding: 12px 22px; border-radius: 999px; color: #0b0d1c; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>

  <div id="side">
    <div class="n"></div>
    <div class="title"></div>
    <div class="line"></div>
    <div class="chips"></div>
  </div>

  <div id="pdf"><img id="pdfImg" alt=""></div>

  <div id="laptopWrap">
    <div id="lid"><div id="lscreen"><iframe id="ngo" src="about:blank"></iframe></div></div>
    <div id="lbase"></div>
  </div>

  <div id="phoneWrap">
    <div id="phone">
      <div class="side-btn" style="left:-4px;top:200px;height:44px"></div>
      <div class="side-btn" style="left:-4px;top:268px;height:78px"></div>
      <div class="side-btn" style="left:-4px;top:360px;height:78px"></div>
      <div class="side-btn" style="right:-4px;top:300px;height:120px"></div>
      <div id="screen">
        <iframe id="game" src="about:blank"></iframe>
        <div id="status"><span>9:41</span><span class="icons">
          <svg width="20" height="13" viewBox="0 0 20 13"><rect x="0" y="9" width="3.5" height="4" rx="1" fill="#fff"/><rect x="5.5" y="6" width="3.5" height="7" rx="1" fill="#fff"/><rect x="11" y="3" width="3.5" height="10" rx="1" fill="#fff"/><rect x="16.5" y="0" width="3.5" height="13" rx="1" fill="#fff"/></svg>
          <svg width="18" height="13" viewBox="0 0 18 13"><path d="M9 12.5 6.2 9.6a4 4 0 0 1 5.6 0z" fill="#fff"/><path d="M3.4 6.9a8 8 0 0 1 11.2 0l-1.4 1.4a6 6 0 0 0-8.4 0z" fill="#fff"/><path d="M.6 4.1a12 12 0 0 1 16.8 0L16 5.5a10 10 0 0 0-14 0z" fill="#fff"/></svg>
          <svg width="28" height="13" viewBox="0 0 28 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" stroke-opacity=".5"/><rect x="2" y="2" width="17" height="9" rx="2" fill="#fff"/><rect x="25" y="4.5" width="2" height="4" rx="1" fill="#fff" fill-opacity=".5"/></svg>
        </span></div>
        <div id="island"></div>
        <canvas id="fx" width="416" height="898"></canvas>
        <div id="glare"></div>
      </div>
    </div>
  </div>

  <div id="captions"><div id="cap"></div></div>
  <div id="overlay"></div>
</div>

<script>
// ---------------------------------------------------------------------------------------------
// Time-driven animation. tween(prop, to, dur, delay, ease) schedules; get(prop) reads at time T.
// ---------------------------------------------------------------------------------------------
let T = 0;
const tracks = {};
const EASE = {
  linear: (x) => x,
  out: (x) => 1 - Math.pow(1 - x, 3),
  in: (x) => x * x * x,
  inOut: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  back: (x) => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2),
};
function get(prop, t = T, dflt = 0) {
  const tr = tracks[prop];
  if (!tr || !tr.length) return dflt;
  let v = tr[0].from;
  for (const s of tr) {
    if (t < s.t0) break;
    const p = s.dur <= 0 ? 1 : Math.min(1, (t - s.t0) / s.dur);
    v = s.from + (s.to - s.from) * EASE[s.ease](p);
  }
  return v;
}
function tween(prop, to, dur = 0.6, delay = 0, ease = 'inOut', dflt = 0) {
  const t0 = T + delay;
  const from = get(prop, t0, dflt);
  (tracks[prop] ??= []).push({ t0, dur, from, to, ease });
  tracks[prop].sort((a, b) => a.t0 - b.t0);
}
function set(prop, v, delay = 0) { tween(prop, v, 0, delay); }

const $ = (id) => document.getElementById(id);
const stage = $('stage');

// ---------------------------------------------------------------------------------------------
// Background: the Hyderabad map, darkened, drifting slowly, with a glow in the segment colour.
// ---------------------------------------------------------------------------------------------
const bg = $('bg').getContext('2d');
const map = new Image();
map.src = '/assets/hyd/map/map_base.png';
let glow = '#6fd6c0';
let night = 0;
function drawBg() {
  bg.imageSmoothingEnabled = false;
  bg.fillStyle = '#07070f';
  bg.fillRect(0, 0, 1920, 1080);
  if (map.complete && map.naturalWidth) {
    const s = 4.4 + 0.15 * Math.sin(T / 23);
    const w = 480 * s, h = 270 * s;
    const x = (1920 - w) / 2 + 60 * Math.sin(T / 31), y = (1080 - h) / 2 + 30 * Math.cos(T / 37);
    bg.drawImage(map, x, y, w, h);
  }
  bg.fillStyle = `rgba(8, 9, 24, ${0.8 + 0.08 * night})`;
  bg.fillRect(0, 0, 1920, 1080);
  const g = bg.createRadialGradient(1310, 540, 60, 1310, 540, 900);
  g.addColorStop(0, hexA(glow, 0.22 * get('glowA', T, 1)));
  g.addColorStop(1, 'rgba(0,0,0,0)');
  bg.fillStyle = g;
  bg.fillRect(0, 0, 1920, 1080);
  const v = bg.createRadialGradient(960, 540, 500, 960, 540, 1250);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,.65)');
  bg.fillStyle = v;
  bg.fillRect(0, 0, 1920, 1080);
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}

// ---------------------------------------------------------------------------------------------
// Side panel: content swaps while it's faded out; elements stagger back in.
// ---------------------------------------------------------------------------------------------
const side = $('side');
const sideParts = [...side.children];
let pendingSide = null;
function applySide(s) {
  side.style.setProperty('--accent', s.color || '#6fd6c0');
  side.querySelector('.n').textContent = s.n ? `PART ${s.n}` : '';
  side.querySelector('.title').textContent = s.title || '';
  side.querySelector('.line').textContent = s.line || '';
  const chips = side.querySelector('.chips');
  chips.innerHTML = '';
  if (s.pillar) chips.insertAdjacentHTML('beforeend', `<span class="chip pillar">${s.pillar}</span>`);
  for (const m of s.measures || []) chips.insertAdjacentHTML('beforeend', `<span class="chip">${m}</span>`);
  glow = s.color || glow;
}
function drawSide() {
  if (pendingSide && T >= pendingSide.at) { applySide(pendingSide.s); pendingSide = null; }
  const a = get('sideA');
  sideParts.forEach((el, i) => {
    const k = Math.max(0, Math.min(1, get(`side${i}`)));
    el.style.opacity = String(k * a);
    el.style.transform = `translateY(${(1 - k) * 34}px)`;
  });
}

// ---------------------------------------------------------------------------------------------
// Phone placement, punch-in zooms, tap ripples and the pixel-block screen wipe.
// ---------------------------------------------------------------------------------------------
const phoneWrap = $('phoneWrap');
const fx = $('fx').getContext('2d');
const ripples = [];
let wipe = null; // {t0, dur, dir: 'in'|'out', color}
const BLOCK = 32;
const order = [];
for (let y = 0; y < Math.ceil(898 / BLOCK); y++)
  for (let x = 0; x < Math.ceil(416 / BLOCK); x++) order.push([x, y, Math.random() * 0.55 + (y / 28) * 0.45]);

function screenPoint(lx, ly) {
  // logical game coords (360×640) → px inside #screen, read from the game's canvas box
  const doc = $('game').contentDocument;
  const c = doc && doc.querySelector('canvas');
  const r = c ? c.getBoundingClientRect() : { left: 0, top: 79, width: 416, height: 740 };
  return { x: r.left + (lx * r.width) / 360, y: r.top + (ly * r.height) / 640 };
}
function drawPhone() {
  const s = get('zs', T, 1);
  const fxp = get('zfx', T, 226), fyp = get('zfy', T, 467); // focus inside the phone (px)
  const px = get('px', T, 1084), py = get('py', T, 73);
  // scale around the focus point, then nudge the focus toward the frame's centre-right
  const k = (s - 1) / 0.6;
  const tx = px + (1 - s) * fxp + Math.max(0, Math.min(1, k)) * (1250 - (px + fxp)) * 0.55;
  const ty = py + (1 - s) * fyp + Math.max(0, Math.min(1, k)) * (540 - (py + fyp)) * 0.55;
  phoneWrap.style.transform = `translate(${tx - 1084}px, ${ty - 73}px) scale(${s})`;
  phoneWrap.style.left = '1084px';
  phoneWrap.style.top = '73px';
  phoneWrap.style.opacity = String(get('phoneA', T, 1));

  fx.clearRect(0, 0, 416, 898);
  for (const r of ripples) {
    const p = (T - r.t0) / 0.55;
    if (p < 0 || p > 1) continue;
    fx.beginPath();
    fx.arc(r.x, r.y, 14 + 34 * EASE.out(p), 0, Math.PI * 2);
    fx.fillStyle = `rgba(255,255,255,${0.32 * (1 - p)})`;
    fx.fill();
    fx.lineWidth = 3;
    fx.strokeStyle = `rgba(255,255,255,${0.85 * (1 - p)})`;
    fx.stroke();
  }
  if (wipe) {
    const p = Math.max(0, Math.min(1, (T - wipe.t0) / wipe.dur));
    fx.fillStyle = wipe.color;
    for (const [x, y, d] of order) {
      const on = wipe.dir === 'in' ? p >= d : p < d;
      if (on) fx.fillRect(x * BLOCK, y * BLOCK, BLOCK, BLOCK);
    }
    if (wipe.dir === 'out' && p >= 1) wipe = null;
  }
}

// ---------------------------------------------------------------------------------------------
// Captions, laptop, PDF and the full-screen cards.
// ---------------------------------------------------------------------------------------------
let caps = [];
const cap = $('cap');
function drawCaptions() {
  const c = caps.find((x) => T >= x.start - 0.05 && T < x.end + 0.35);
  if (!c) { cap.style.opacity = '0'; return; }
  const a = Math.min(1, (T - c.start + 0.05) / 0.18) * Math.min(1, (c.end + 0.35 - T) / 0.2);
  cap.textContent = c.text;
  cap.style.opacity = String(Math.max(0, a));
  cap.style.transform = `translateY(${(1 - Math.min(1, (T - c.start + 0.05) / 0.25)) * 12}px)`;
  $('captions').style.left = `${get('capX', T, 150)}px`;
}
function drawLaptop() {
  const a = get('lapA');
  const el = $('laptopWrap');
  el.style.opacity = String(a);
  el.style.transform = `translateX(${(1 - a) * 160}px) scale(${0.96 + 0.04 * a})`;
}
function drawPdf() {
  const a = get('pdfA');
  const el = $('pdf');
  el.style.opacity = String(a);
  el.style.transform = `translateY(${(1 - a) * 120}px) rotate(${-3 + 3 * a}deg)`;
}

const overlay = $('overlay');
const cards = [];
function card(html, t0, t1, opts = {}) {
  const el = document.createElement('div');
  el.className = 'full';
  el.innerHTML = html;
  el.style.opacity = '0';
  if (opts.bg) el.style.background = opts.bg;
  overlay.appendChild(el);
  cards.push({ el, t0, t1, fadeIn: opts.fadeIn ?? 0.5, fadeOut: opts.fadeOut ?? 0.5, rise: opts.rise ?? 30, on: opts.on });
}
function drawCards() {
  for (const c of cards) {
    const a = Math.max(0, Math.min(1, (T - c.t0) / c.fadeIn, (c.t1 - T) / c.fadeOut));
    c.el.style.opacity = String(a);
    c.el.style.transform = `translateY(${(1 - Math.min(1, Math.max(0, (T - c.t0) / (c.fadeIn + 0.3)))) * c.rise}px)`;
    if (c.on && a > 0) c.on(c.el, T - c.t0);
  }
}

// ---------------------------------------------------------------------------------------------
// The API the recorder calls.
// ---------------------------------------------------------------------------------------------
window.studio = {
  /** Draw every layer for video time t (seconds). */
  frame(t) {
    T = t;
    drawBg();
    drawSide();
    drawPhone();
    drawLaptop();
    drawPdf();
    drawCaptions();
    drawCards();
  },
  now: () => T,
  loadGame(src) { $('game').src = src; },
  /** New part: side panel out, swap, stagger in. */
  segment(s) {
    tween('sideA', 1, 0, 0);
    sideParts.forEach((_, i) => tween(`side${i}`, 0, 0.3, 0, 'in'));
    pendingSide = { at: T + 0.32, s };
    sideParts.forEach((_, i) => tween(`side${i}`, 1, 0.7, 0.35 + i * 0.09, 'out'));
    night = s.night ? 1 : 0;
  },
  sideOff(dur = 0.4) { tween('sideA', 0, dur); },
  sideOn(dur = 0.4) { tween('sideA', 1, dur); },
  captions(lines) { caps = caps.concat(lines); },
  tap(lx, ly) {
    const p = screenPoint(lx, ly);
    ripples.push({ x: p.x, y: p.y, t0: T });
  },
  /** Punch-in around a game point (logical coords). */
  zoom(lx, ly, s = 1.4, dur = 0.9) {
    const p = screenPoint(lx, ly);
    tween('zfx', 18 + p.x, dur, 0, 'inOut', 226);
    tween('zfy', 18 + p.y, dur, 0, 'inOut', 467);
    tween('zs', s, dur, 0, 'inOut', 1);
    tween('sideA', 0.18, dur * 0.7);
  },
  unzoom(dur = 0.8) {
    tween('zs', 1, dur, 0, 'inOut', 1);
    tween('sideA', 1, dur);
  },
  wipeIn(dur = 0.32, color = '#0b0d1c') { wipe = { t0: T, dur, dir: 'in', color }; },
  wipeOut(dur = 0.38) { if (wipe) wipe = { ...wipe, t0: T, dur, dir: 'out' }; },
  phone(prop, to, dur = 0.8, delay = 0, ease = 'inOut') {
    const d = { px: 1084, py: 73, phoneA: 1 }[prop] ?? 0;
    tween(prop, to, dur, delay, ease, d);
  },
  laptop(on, src) { if (src) $('ngo').src = src; tween('lapA', on ? 1 : 0, 0.8, 0, 'out'); },
  pdf(on, src, dur = 0.7) { if (src) $('pdfImg').src = src; tween('pdfA', on ? 1 : 0, dur, 0, on ? 'out' : 'in'); },
  captionsX(x, dur = 0.6) { tween('capX', x, dur, 0, 'inOut', 150); },
  coldOpen() {
    const t = T;
    card('', t - 1, t + 7.3, { bg: '#05050b', fadeIn: 0.01, fadeOut: 0.6 }); // black until the title
    card(`<div class="big"><span id="stat">0</span>%</div><div class="sub">of Indian adults are financially literate.</div><div class="src">NCFE National Financial Literacy Survey, 2019</div>`,
      t + 0.2, t + 3.9, { bg: '#05050b', on: (el, dt) => { const s = el.querySelector('#stat'); s.textContent = String(Math.round(27 * EASE.out(Math.min(1, dt / 1.6)))); } });
    card(`<div class="q">What if every student could live the lesson, <span style="color:#6fd6c0">before it costs them?</span></div>`,
      t + 4.0, t + 7.0, { bg: '#05050b' });
    card(`<div class="logo">Learning Money<br>by Living It</div><div class="tag">A pixel life-sim for Grade 11–12 students in Hyderabad</div>`,
      t + 7.0, t + 9.0, { fadeIn: 0.5, fadeOut: 0.5, rise: 0 });
  },
  endCard() {
    const t = T;
    card(`<div class="logo">Learning Money<br>by Living It</div>
      <div class="tag">Make choices. See consequences. Try again.</div>
      <div class="pillars"><span style="background:#ffb347">Plan &amp; budget</span><span style="background:#6fd6c0">Save &amp; manage</span><span style="background:#7bd88f">Understand investing</span><span style="background:#ff6b6b">Stay safe</span></div>
      <div class="meta">TEAM 97 · FINANCIAL LITERACY CHALLENGE</div>`,
      t + 0.2, t + 60, { bg: 'radial-gradient(circle at 50% 45%, #1d1f3d 0%, #07070f 70%)', fadeIn: 0.8 });
  },
};
studio.frame(0);
</script>
</body>
</html>
