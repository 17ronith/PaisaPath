<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f2a1e" />
    <title>Learning Money by Living It</title>
    <link rel="icon" href="./icons/icon-192.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #1f2a1e;
        height: 100%;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }
      /* Desktops, tablets and landscape phones: the 9:16 game sits centred over the
         Hyderabad map instead of flat margins, framed like a phone. */
      @media (min-aspect-ratio: 10/16) {
        body {
          background:
            linear-gradient(rgba(24, 34, 22, 0.5), rgba(24, 34, 22, 0.68)),
            url('/assets/hyd/map/map_base.png') center / cover no-repeat #1f2a1e;
          image-rendering: pixelated;
        }
        canvas {
          border-radius: 14px;
          box-shadow:
            0 0 0 3px #2a3326,
            0 18px 60px rgba(0, 0, 0, 0.6);
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
